[project]
name = "celnav-core"
version = "0.1.0"
description = "Celestial navigation core library — shared between polaris2 and navpac-simulator"
requires-python = ">=3.11"
dependencies = [
    "skyfield",
    "pydantic>=2.0",
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "SIM", "PL"]
ignore = ["SIM117", "PLR0913", "S311", "S110", "PLW0603", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
show_missing = true
