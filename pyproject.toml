[project]
name = "celnav-core"
version = "0.1.0"
description = "Celestial navigation core library — shared between polaris2 and navpac-simulator"
requires-python = ">=3.11"
dependencies = [
    "skyfield",
    "pydantic>=2.0",
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "SIM", "PL"]
ignore = ["SIM117", "PLR0913", "S311", "S110", "PLW0603", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.coverage.run]
source = ["celnav_core"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
